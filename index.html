<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f5b4a">
<title>وين الغاز؟</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#1f5b4a;--gd:#143d32;--fl:#e8761d;--bg:#f2f4f0;--card:#fff;--tx:#18241f;--mu:#667069;--ok:#1f7a4d;--no:#b3402f;--ln:#dfe4dc}
@media(prefers-color-scheme:dark){:root{--bg:#101a16;--card:#18251f;--tx:#e9efe9;--mu:#9aa89f;--ln:#2a3a32;--g:#2d8266}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.6}
header{background:var(--gd);color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:26px;font-weight:700}
header p{margin:2px 0 0;opacity:.85;font-size:14px}
.bar{display:flex;gap:8px;padding:12px 16px 0}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--ln);border-radius:10px;padding:10px 12px;width:100%}
.chips{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--ln);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#fff}
main{padding:4px 16px 96px;display:grid;gap:10px}
.pt{background:var(--card);border-radius:14px;padding:14px;border-inline-start:6px solid var(--ok);box-shadow:0 1px 3px #0001}
.pt.out{border-inline-start-color:var(--no)}
.pt.old{opacity:.7}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nm{font-weight:700;font-size:17px}
.ar{color:var(--mu);font-size:14px}
.st{font-weight:700;font-size:14px;color:var(--ok);white-space:nowrap}
.out .st{color:var(--no)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0;font-size:14px;color:var(--mu)}
.meta b{color:var(--tx)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.b{border:1.5px solid var(--ln);background:none;color:var(--tx);border-radius:10px;padding:7px 12px;font-size:14px}
.b:disabled{opacity:.5}
.warn{color:var(--fl);font-size:13px;font-weight:500;background:#fff4e5;padding:6px 10px;border-radius:8px;margin:6px 0}
.empty{text-align:center;color:var(--mu);padding:40px 10px;line-height:1.8}
.empty .retry{background:var(--g);color:#fff;border:0;padding:10px 18px;border-radius:99px;margin-top:12px;font-weight:700}
.status{padding:0 16px 8px;font-size:12px;color:var(--mu);display:flex;justify-content:space-between}
.fab{position:fixed;inset-inline:16px;bottom:16px;background:var(--fl);color:#fff;border:0;border-radius:14px;padding:14px;font-size:18px;font-weight:700;box-shadow:0 4px 14px #0004;z-index:10}
dialog{border:0;border-radius:18px;padding:18px;width:min(92vw,420px);background:var(--card);color:var(--tx)}
dialog::backdrop{background:#0008}
label{display:block;margin:10px 0 4px;font-size:14px;font-weight:500}
.row{display:flex;gap:8px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--ln);background:none;color:var(--tx)}
.seg button[aria-pressed=true].a{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button[aria-pressed=true].o{background:var(--no);border-color:var(--no);color:#fff}
.seg button[aria-pressed=true].q{background:var(--g);border-color:var(--g);color:#fff}
.go{width:100%;margin-top:16px;background:var(--g);color:#fff;border:0;border-radius:12px;padding:13px;font-size:17px;font-weight:700}
.x{background:none;border:0;color:var(--mu);width:100%;margin-top:6px;padding:8px}
#msg{color:var(--no);font-size:14px;min-height:20px;margin-top:8px}
:focus-visible{outline:3px solid var(--fl);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>وين الغاز؟</h1>
  <p>الناس بتساعد بعض بمعلومات الغاز وسعره، تتحدث لحظة بلحظة</p>
</header>
<div class="bar">
  <input id="city" placeholder="المدينة - مثال: عطبرة" aria-label="المدينة">
  <input id="q" placeholder="ابحث بالحي أو الاسم" aria-label="بحث">
</div>
<div class="chips" role="group" aria-label="فلترة">
  <button class="chip" data-f="available" aria-pressed="true">متوفر</button>
  <button class="chip" data-f="all" aria-pressed="false">الكل</button>
  <button class="chip" data-f="out" aria-pressed="false">خلص</button>
  <button class="chip" id="share">شارك التطبيق</button>
</div>
<div class="status"><span id="conn">⏳ جاري التحميل...</span><span id="cnt"></span></div>
<main id="list"><div class="empty">جاري التحميل...</div></main>
<button class="fab" id="add">➕ ساعد غيرك - وين لقيت غاز؟</button>

<dialog id="dlg">
  <h2 id="dt" style="margin:0 0 4px;font-size:20px">شارك مكان غاز جديد</h2>
  <div id="nameBox">
    <label for="fn">اسم المكان</label>
    <input id="fn" maxlength="60" placeholder="مثال: محطة الشرقي">
    <div class="row">
      <div style="flex:1"><label for="fc">المدينة</label><input id="fc" maxlength="40" placeholder="عطبرة"></div>
      <div style="flex:1"><label for="fa">الحي</label><input id="fa" maxlength="60" placeholder="حي المطار مربع 11"></div>
    </div>
  </div>
  <label>الحالة</label>
  <div class="seg" id="sg">
    <button type="button" class="a" data-v="available" aria-pressed="true">متوفر</button>
    <button type="button" class="o" data-v="out" aria-pressed="false">خلص</button>
  </div>
  <label for="fp">السعر (جنيه، اختياري)</label>
  <input id="fp" type="number" inputmode="numeric" min="0" placeholder="مثال: 35000">
  <label>الزحمة</label>
  <div class="seg" id="sq">
    <button type="button" class="q" data-v="none" aria-pressed="true">ما في صف</button>
    <button type="button" class="q" data-v="short" aria-pressed="false">صف قصير</button>
    <button type="button" class="q" data-v="long" aria-pressed="false">صف طويل</button>
  </div>
  <div id="msg" role="alert"></div>
  <button class="go" id="save">شارك المكان</button>
  <button class="x" id="cancel">إلغاء</button>
</dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js?v=3"></script>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const QL={none:"ما في صف",short:"صف قصير",long:"صف طويل"};
const CACHE_KEY="wain_gaz_pts_v3";
let pts=[],flt="available",edit=null,db,unsub=null;
let voted={};try{voted=JSON.parse(localStorage.getItem("voted")||"{}")}catch(e){}
const pick=(sel,v)=>document.querySelectorAll(sel+" button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===v)));
const val=sel=>{const el=document.querySelector(sel+' [aria-pressed=true]');return el?el.dataset.v:"none"};

$("#city").value=localStorage.getItem("city")||(window.DEFAULT_CITY)||"";

function normalize(s){return String(s||"").trim().toLowerCase().replace(/[ةه]/g,"ه").replace(/أ|إ|آ/g,"ا")}

function ago(ms){const m=Math.max(0,Math.round((Date.now()-ms)/60000));
  if(m<1)return"الآن";if(m<60)return"قبل "+m+" دقيقة";
  const h=Math.round(m/60);if(h<24)return"قبل "+h+" ساعة";return"قبل "+Math.round(h/24)+" يوم"}

function saveCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({pts,at:Date.now()}))}catch{}}
function loadCache(){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");if(c&&c.pts){pts=c.pts;return true}}catch{}return false}

function render(){
  const now=Date.now();
  const cNorm=normalize($("#city").value), qNorm=normalize($("#q").value);
  const rows=pts.filter(p=>{
    // خلص بتختفي بعد 30 دقيقة من المكان
    if(p.status==="out" && now - (p.updatedAt||0) > 30*60*1000){
      if(flt==="out") return true; // بس في تبويب خلص تظهر
      return false; // في الكل والمتوفر اخفيها
    }
    const cityOk=!cNorm||normalize(p.city).includes(cNorm);
    const statusOk=flt==="all"||p.status===flt;
    const qOk=!qNorm||normalize(p.name+" "+p.area).includes(qNorm);
    return cityOk&&statusOk&&qOk;
  }).sort((a,b)=>{
    // المتوفر فوق، الخلص تحت
    if(a.status!==b.status) return a.status==="available"?-1:1;
    return (b.updatedAt||0)-(a.updatedAt||0);
  });
  const availableCount = pts.filter(p=>p.status==="available").length;
  $("#cnt").textContent=flt==="available"?availableCount+" نقطة متوفرة":rows.length+" نقطة";
  if(flt==="available" && rows.length===0 && pts.length>0){
    $("#list").innerHTML='<div class="empty">ما في غاز متوفر حاليا في '+esc($("#city").value||"المدينة")+'<br>جرب تفتح تبويب "الكل" عشان تشوف النقاط الخلصت<br><br>كن أول من يبلّغ لما يجي الغاز!</div>';return
  }
  if(!rows.length){$("#list").innerHTML='<div class="empty">ما في مكانات هنا لسه.<br>كن أول من يبلّغ بالضغط على الزر تحت.</div>';return}
  $("#list").innerHTML=rows.map(p=>{
    const t=p.updatedAt||0,old=Date.now()-t>24*3600*1000,dbt=p.no>=3&&p.no>p.yes,v=voted[p.id]===t;
    return `<article class="pt ${p.status==="out"?"out":""} ${old?"old":""}">
      <div class="top"><div><div class="nm">${esc(p.name)}</div><div class="ar">${esc(p.area)}${p.area&&p.city?"، ":""}${esc(p.city)}</div></div>
      <div class="st">${p.status==="out"?"خلص":"متوفر"}</div></div>
      <div class="meta"><span>السعر: <b>${p.price?esc(p.price)+" ج":"غير معروف"}</b></span><span><b>${QL[p.queue]||""}</b></span><span>${ago(t)}</span></div>
      ${dbt?'<div class="warn">⚠️ ناس كتير قالت المعلومة دي غير صحيحة</div>':""}
      <div class="acts">
        <button class="b" data-a="yes" data-id="${p.id}" ${v?"disabled":""}>تأكدت (${p.yes||0})</button>
        <button class="b" data-a="no" data-id="${p.id}" ${v?"disabled":""}>غير صحيح (${p.no||0})</button>
        <button class="b" data-a="upd" data-id="${p.id}">عدّل</button>
      </div></article>`}).join("")
}

function open_(p){
  edit=p||null;$("#msg").textContent="";
  $("#dt").textContent=p?"تعديل: "+p.name:"شارك مكان غاز جديد";
  $("#nameBox").hidden=!!p;
  if(!p){$("#fn").value="";$("#fa").value="";}
  $("#fc").value=p?p.city:($("#city").value||"");
  pick("#sg",p?p.status:"available");pick("#sq",p?p.queue:"none");
  $("#fp").value=p&&p.price?p.price:"";
  $("#dlg").showModal()
}

async function save(){
  const now=Date.now(),status=val("#sg"),queue=val("#sq"),pr=parseInt($("#fp").value)||null;
  let name,city,area;
  if(edit){
    // تحديث محلي سريع
    const idx=pts.findIndex(x=>x.id===edit.id);
    if(idx>-1){ pts[idx]={...pts[idx], status,queue,price:pr,updatedAt:now,yes:0,no:0}; render(); saveCache(); }
  }else{
    name=$("#fn").value.trim();city=$("#fc").value.trim();area=$("#fa").value.trim();
    if(name.length<2||!city){$("#msg").textContent="اكتب اسم المكان والمدينة";$("#msg").style.color="#b3402f";return}
    // إضافة محلية فورية - تظهر في أقل من 100 ملي ثانية
    const tempId="temp_"+now;
    const newPoint={id:tempId,name,city,area,status,queue,price:pr,updatedAt:now,yes:0,no:0,_temp:true};
    pts=[newPoint,...pts]; render(); saveCache();
    localStorage.setItem("city",city);$("#city").value=city;
  }
  // اقفل النافذة فورا - ما تنتظر النت
  $("#dlg").close(); $("#msg").textContent=""; $("#save").disabled=false;
  $("#conn").textContent="⏳ جاري المزامنة...";

  try{
    if(edit){
      await db.collection("points").doc(edit.id).update({status,queue,price:pr,updatedAt:now,yes:0,no:0});
    }else{
      await db.collection("points").add({name,city,area,status,queue,price:pr,updatedAt:now,yes:0,no:0});
    }
    $("#conn").textContent="✅ تم الحفظ";
    setTimeout(()=>{$("#conn").textContent="متصل"},2000);
  }catch(e){
    $("#conn").textContent="⚠️ حُفظ محليا، سيُرسل عند تحسن النت";
    // حاول تاني بعد 5 ثواني
    setTimeout(()=>{ if(db) save(); },5000);
    console.error(e);
  }
}

$("#list").addEventListener("click",async e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  const p=pts.find(x=>x.id===b.dataset.id);if(!p)return;
  if(b.dataset.a==="upd")return open_(p);
  const f=b.dataset.a;
  b.disabled=true;
  try{await db.collection("points").doc(p.id).update({[f]:firebase.firestore.FieldValue.increment(1)});
    voted[p.id]=p.updatedAt;localStorage.setItem("voted",JSON.stringify(voted))}catch(err){b.disabled=false}
});
document.querySelectorAll(".chip[data-f]").forEach(b=>b.onclick=()=>{
  flt=b.dataset.f;document.querySelectorAll(".chip[data-f]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));render()});
$("#city").oninput=()=>{localStorage.setItem("city",$("#city").value);render()};
$("#q").oninput=render;
$("#add").onclick=()=>open_();
$("#cancel").onclick=()=>$("#dlg").close();
$("#save").onclick=save;
["#sg","#sq"].forEach(s=>$(s).onclick=e=>{const b=e.target.closest("button");if(b)pick(s,b.dataset.v)});
$("#share").onclick=()=>{
  const u=location.href.split("?")[0],t="وين الغاز؟ شوف الغاز المتوفر وبلّغ: ";
  if(navigator.share){navigator.share({title:"وين الغاز؟",text:t,url:u}).catch(()=>{})}
  else{location.href="https://wa.me/?text="+encodeURIComponent(t+u)}
};

// === إصلاح مشكلة التحديث ===

// === نظام تتبع الزوار للمدير ===
async function trackVisit(){
  try{
    const today=new Date().toISOString().slice(0,10);
    const hasVisited=localStorage.getItem("visited_"+today);
    const isNewUser=!localStorage.getItem("ever_visited");
    
    const globalRef=db.collection("stats").doc("global");
    const dailyRef=db.collection("stats").doc("daily").collection("days").doc(today);
    
    // زيادة العدادات
    await globalRef.set({
      total: firebase.firestore.FieldValue.increment(1),
      today: firebase.firestore.FieldValue.increment(hasVisited?0:1),
      unique: firebase.firestore.FieldValue.increment(isNewUser?1:0),
      lastVisit: Date.now()
    },{merge:true});
    
    await dailyRef.set({
      date: today,
      count: firebase.firestore.FieldValue.increment(hasVisited?0:1)
    },{merge:true});
    
    // حسب المدينة
    const city=$("#city").value||"غير محدد";
    const cityRef=db.collection("stats").doc("cities").collection("list").doc(city||"unknown");
    if(!hasVisited){
      await cityRef.set({count: firebase.firestore.FieldValue.increment(1), name: city},{merge:true});
    }
    
    localStorage.setItem("visited_"+today,"1");
    localStorage.setItem("ever_visited","1");
  }catch(e){ console.log("track error",e); }
}
// شغل التتبع بعد ثانيتين
setTimeout(trackVisit,2000);

let gotFirstData=false;
function startFirestore(){
  if(!window.FIREBASE_CONFIG||!window.FIREBASE_CONFIG.apiKey){
    $("#list").innerHTML='<div class="empty">إعدادات Firebase ناقصة<br>اتأكد ملف config.js موجود<br><small>window.FIREBASE_CONFIG</small></div>';
    $("#conn").textContent="⚠️ config ناقص"; return;
  }
  try{
    firebase.initializeApp(window.FIREBASE_CONFIG);
    db=firebase.firestore();
    db.settings({experimentalForceLongPolling:true});
    // تفعيل التخزين المحلي
    db.enablePersistence({synchronizeTabs:true}).catch(()=>{});

    // Timeout: لو بعد 7 ثواني ما جانا شي، اعرض الكاش
    setTimeout(()=>{
      if(!gotFirstData){
        if(loadCache()){
          render();
          $("#conn").textContent="📴 offline - بيانات محفوظة";
        } else {
          $("#list").innerHTML='<div class="empty">النت ضعيف وما قدرنا نجيب البيانات<br><button class="retry" onclick="location.reload()">حاول مجددا</button><br><br><small>تأكد Firestore Rules تسمح بالقراءة</small></div>';
          $("#conn").textContent="❌ فشل التحميل";
        }
      }
    },7000);

    unsub=db.collection("points").orderBy("updatedAt","desc").limit(300).onSnapshot(s=>{
      gotFirstData=true;
      const serverPts=s.docs.map(d=>({id:d.id,...d.data()}));
      // ادمج مع المؤقتة المحلية لو لسه ما وصلت
      const tempPts=pts.filter(p=>p._temp && (Date.now()-p.updatedAt<60000));
      pts=[...tempPts.filter(tp=>!serverPts.some(sp=>sp.name===tp.name && sp.city===tp.city)), ...serverPts];
      pts.forEach(p=>delete p._temp);
      saveCache();
      render();
      $("#conn").textContent="✅ محدث لحظيا";
      setTimeout(()=>{$("#conn").textContent="متصل"},3000);
    },err=>{
      console.error(err);
      $("#conn").textContent="❌ خطأ: "+(err.code||"");
      if(loadCache()){render(); $("#conn").textContent+=" - عرض بيانات محفوظة"}
      else{$("#list").innerHTML='<div class="empty">تعذر تحميل البيانات<br>السبب: '+(err.message||err.code)+'<br><button class="retry" onclick="location.reload()">حاول مجددا</button><br><br>اتأكد من:<br>1- Firebase Rules<br>2- النت<br>3- config.js</div>'}
    });

  }catch(e){
    $("#list").innerHTML='<div class="empty">خطأ في تهيئة Firebase<br>'+esc(e.message)+'</div>';
  }
}
startFirestore();

// تحديث لما ترجع للصفحة
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&db){$("#conn").textContent="🔄 تحديث..."}});

<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="ht
