<html lang="ar" dir="rtl">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم خفيفة</title>
<style>
body{font-family:system-ui;background:#f2f4f0;margin:0;padding:16px;color:#18241f}
.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #0001}
.num{font-size:32px;font-weight:700;color:#1f5b4a}
.label{color:#667069;font-size:13px}
.err{color:#b3402f;background:#ffeaea;padding:10px;border-radius:8px}
.ok{color:#1f5b4a;background:#e6f5ec;padding:10px;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px;border-bottom:1px solid #eee;text-align:right}
button{background:#1f5b4a;color:#fff;border:0;padding:10px 16px;border-radius:99px;font-weight:700}
</style>
</head>
<body>
<h2>📊 لوحة تحكم - خفيفة وسريعة</h2>
<div id="status" class="card">⏳ جاري التحميل...</div>
<div class="card">
  <div style="display:flex;gap:16px;flex-wrap:wrap">
    <div><div class="num" id="total">-</div><div class="label">إجمالي النقاط</div></div>
    <div><div class="num" id="avail">-</div><div class="label">متوفر</div></div>
    <div><div class="num" id="out">-</div><div class="label">خلص</div></div>
  </div>
</div>
<div class="card"><table id="tbl"><thead><tr><th>المكان</th><th>المدينة</th><th>الحالة</th><th>وقت</th></tr></thead><tbody></tbody></table></div>
<div class="card"><button onclick="load()">🔄 تحديث الآن</button> <small id="time"></small></div>

<script src="config.js?v=999"></script>
<script>
async function load(){
  const s=document.getElementById('status');
  const t0=Date.now();
  s.innerHTML='⏳ جاري التحميل... ('+new Date().toLocaleTimeString()+')';
  try{
    if(!window.FIREBASE_CONFIG || !window.FIREBASE_CONFIG.apiKey){
      throw new Error('config.js ما موجود - اتأكد الملف موجود جنب admin.html');
    }
    const cfg=window.FIREBASE_CONFIG;
    // استعلام مباشر بدون SDK - اسرع بكتير
    const url=`https://firestore.googleapis.com/v1/projects/${cfg.projectId}/databases/(default)/documents/points?pageSize=300`;
    const res=await fetch(url);
    if(!res.ok){
      const txt=await res.text();
      throw new Error('Firestore رد: '+res.status+' - '+txt.slice(0,200));
    }
    const data=await res.json();
    const docs=(data.documents||[]).map(d=>{
      const f=d.fields||{};
      const get=k=> f[k] ? (f[k].stringValue || f[k].integerValue || f[k].doubleValue || '') : '';
      return {
        name: get('name'),
        city: get('city'),
        area: get('area'),
        status: get('status'),
        updatedAt: parseInt(get('updatedAt')||0)
      };
    });
    
    document.getElementById('total').textContent=docs.length;
    document.getElementById('avail').textContent=docs.filter(d=>d.status==='available').length;
    document.getElementById('out').textContent=docs.filter(d=>d.status==='out').length;
    
    const tbody=document.querySelector('#tbl tbody');
    docs.sort((a,b)=>b.updatedAt-a.updatedAt);
    tbody.innerHTML=docs.slice(0,30).map(p=>{
      const m=Math.round((Date.now()-p.updatedAt)/60000);
      const ago=m<60?m+' د':Math.round(m/60)+' س';
      return `<tr><td>${p.name}</td><td>${p.city}</td><td>${p.status==='available'?'🟢 متوفر':'🔴 خلص'}</td><td>${ago}</td></tr>`;
    }).join('') || '<tr><td colspan=4>لا يوجد نقاط</td></tr>';
    
    s.innerHTML='<div class="ok">✅ تم التحميل في '+(Date.now()-t0)+'ms - project: '+cfg.projectId+' - '+docs.length+' نقطة</div>';
    document.getElementById('time').textContent='آخر تحديث: '+new Date().toLocaleTimeString();
    
  }catch(e){
    s.innerHTML='<div class="err">❌ خطأ: '+e.message+'<br><br>الحل:<br>1- تأكد config.js موجود<br>2- تأكد projectId صحيح<br>3- جرب افتح الرابط في تاب جديد</div>';
    console.error(e);
  }
}
load();
setInterval(load,30000);
</script>

</html>
