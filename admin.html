<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم - وين الغاز؟</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#1f5b4a;--bg:#f2f4f0;--card:#fff;--tx:#18241f;--mu:#667069}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Arabic",sans-serif;padding:16px}
h1{color:var(--g)}
.card{background:var(--card);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.num{font-size:32px;font-weight:700;color:var(--g)}
.label{color:var(--mu);font-size:14px}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:8px;text-align:right;border-bottom:1px solid #eee;font-size:14px}
</style>
</head>
<body>
<h1>📊 لوحة تحكم - وين الغاز؟</h1>
<p id="status">جاري تحميل الإحصائيات...</p>

<div class="grid">
  <div class="card"><div class="num" id="total">-</div><div class="label">إجمالي الزيارات</div></div>
  <div class="card"><div class="num" id="today">-</div><div class="label">زيارات اليوم</div></div>
  <div class="card"><div class="num" id="unique">-</div><div class="label">زوار فريدين</div></div>
  <div class="card"><div class="num" id="points">-</div><div class="label">عدد النقاط</div></div>
</div>

<div class="card">
  <h3>الزيارات حسب المدينة</h3>
  <div id="cities">-</div>
</div>

<div class="card">
  <h3>الزيارات آخر 7 أيام</h3>
  <canvas id="chart" width="400" height="200" style="width:100%"></canvas>
</div>

<div class="card">
  <h3>آخر النقاط المضافة</h3>
  <table id="lastPoints"><tr><th>المكان</th><th>المدينة</th><th>الحالة</th><th>الوقت</th></tr></table>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
firebase.initializeApp(window.FIREBASE_CONFIG);
const db=firebase.firestore();

async function load(){
  try{
    const statsSnap=await db.collection("stats").doc("global").get();
    const stats=statsSnap.exists?statsSnap.data():{total:0,unique:0,today:0};
    $("total").textContent=stats.total||0;
    $("today").textContent=stats.today||0;
    $("unique").textContent=stats.unique||0;

    const pointsSnap=await db.collection("points").orderBy("updatedAt","desc").limit(20).get();
    $("points").textContent=pointsSnap.size;
    let rows="";
    const cities={};
    pointsSnap.forEach(d=>{
      const p=d.data();
      cities[p.city]=(cities[p.city]||0)+1;
      const ago=Math.round((Date.now()-p.updatedAt)/60000);
      rows+=`<tr><td>${p.name}</td><td>${p.city}</td><td>${p.status==="available"?"متوفر":"خلص"}</td><td>${ago<60?ago+" دقيقة":Math.round(ago/60)+" ساعة"}</td></tr>`;
    });
    $("lastPoints").innerHTML+="<tbody>"+rows+"</tbody>";
    $("cities").innerHTML=Object.entries(cities).map(([c,n])=>`${c}: ${n}`).join("<br>")||"لا يوجد";

    // تحميل الإحصائيات اليومية
    const dailySnap=await db.collection("stats").doc("daily").collection("days").orderBy("date","desc").limit(7).get();
    const days=[];
    dailySnap.forEach(d=>days.push(d.data()));
    days.reverse();
    drawChart(days);

    $("status").textContent="✅ آخر تحديث: "+new Date().toLocaleString("ar-SD");
  }catch(e){
    $("status").textContent="❌ خطأ: "+e.message+" - تأكد من Rules";
  }
}

function drawChart(days){
  const c=document.getElementById("chart");
  const ctx=c.getContext("2d");
  const max=Math.max(1,...days.map(d=>d.count||0));
  ctx.clearRect(0,0,c.width,c.height);
  if(!days.length) return;
  const w=c.width/days.length;
  days.forEach((d,i)=>{
    const h=(d.count||0)/max*150;
    ctx.fillStyle="#1f5b4a";
    ctx.fillRect(i*w+10, 180-h, w-20, h);
    ctx.fillStyle="#667069";
    ctx.font="12px sans-serif";
    ctx.fillText(d.count||0, i*w+15, 175-h);
    ctx.fillText((d.date||"").slice(5), i*w+5, 195);
  });
}
load();
setInterval(load,30000);
</script>
</body>
</html>
