<html lang="ar" dir="rtl">
<head><style>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>عداد الزوار - وين الغاز؟</title>
<style>
body{font-family:system-ui;background:#f2f4f0;margin:0;padding:16px;color:#18241f}
.card{background:#fff;border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 1px 4px #0001;text-align:center}
.num{font-size:42px;font-weight:800;color:#1f5b4a}
.label{color:#667069;font-size:13px}
.ok{background:#e6f5ec;color:#1f5b4a;padding:12px;border-radius:10px}
.err{background:#ffeaea;color:#b3402f;padding:12px;border-radius:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;padding:14px;border-radius:99px;font-weight:800;width:100%;font-size:15px;cursor:pointer}
.btn-orange{background:#e8761d;color:#fff}
.btn-green{background:#1f5b4a;color:#fff}
</style>
</head>
<body>
<h2 style="text-align:center">👥 عداد الزوار فقط</h2>

<div id="status" class="card">⏳ جاري التحميل...</div>

<div class="card" id="initCard" style="border:2px solid #e8761d">
  <button class="btn-orange" onclick="initCounter()">🚀 ابدأ عد الزوار الآن - دوس هنا مرة واحدة</button>
  <div id="initMsg" style="margin-top:10px;font-size:13px"></div>
</div>

<div class="grid">
  <div class="card"><div class="num" id="unique">-</div><div class="label">زوار فريدين<br>أجهزة مختلفة</div></div>
  <div class="card"><div class="num" id="total">-</div><div class="label">إجمالي الزيارات<br>كل مرة فتحو الموقع</div></div>
</div>

<div class="card"><div class="num" id="today" style="font-size:32px">-</div><div class="label">زيارات اليوم</div><div id="daily" style="margin-top:10px;text-align:right;font-size:12px"></div></div>

<div class="card">
  <button class="btn-green" onclick="load()">🔄 تحديث الآن</button>
  <div id="time" style="font-size:11px;color:#999;margin-top:6px"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js?v=final_visitors_999"></script>
<script>
async function initCounter(){
  const msg=document.getElementById('initMsg');
  msg.textContent='⏳ جاري إنشاء العداد...';
  try{
    if(!window.FIREBASE_CONFIG) throw new Error('config.js ناقص');
    if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    const db=firebase.firestore();
    const globalRef=db.collection('stats').doc('global');
    await globalRef.set({totalVisits:1,uniqueVisitors:1,totalContributions:0,lastVisit:Date.now()},{merge:false});
    const today=new Date().toISOString().slice(0,10);
    const dailyRef=db.collection('stats').doc('daily').collection('days').doc(today);
    await dailyRef.set({date:today,visits:1},{merge:false});
    msg.innerHTML='<span style="color:green">✅ تم! العداد اتفعل - دوس تحديث الآن تحت</span>';
    setTimeout(load,1200);
  }catch(e){
    // لو موجود قبل كدا
    if(e.code=='already-exists' || e.message.includes('ALREADY_EXISTS') || e.message.includes('exists')){
      msg.innerHTML='✅ العداد موجود أصلا - دوس تحديث';
      setTimeout(load,800);
    }else{
      msg.textContent='❌ '+e.message;
      // حاول merge
      try{
        const db=firebase.firestore();
        await db.collection('stats').doc('global').set({totalVisits: firebase.firestore.FieldValue.increment(1),uniqueVisitors: firebase.firestore.FieldValue.increment(1),lastVisit:Date.now()},{merge:true});
        msg.textContent='✅ تم التفعيل (محاولة ثانية)';
        setTimeout(load,800);
      }catch(e2){
        msg.textContent='❌ '+e2.message;
      }
    }
  }
}
async function load(){
  const status=document.getElementById('status');
  status.innerHTML='⏳ جاري التحميل...';
  try{
    if(!window.FIREBASE_CONFIG) throw new Error('config.js ناقص');
    if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    const db=firebase.firestore();
    const globalSnap=await db.collection('stats').doc('global').get();
    if(!globalSnap.exists){
      status.innerHTML='<div class="err">⚠️ لسه مافي زيارات<br><small style="font-size:12px">دوس الزر البرتقالي فوق عشان تبدأ العد</small></div>';
      document.getElementById('total').textContent='0';
      document.getElementById('unique').textContent='0';
      document.getElementById('today').textContent='0';
      document.getElementById('initCard').style.display='block';
      return;
    }
    const data=globalSnap.data();
    document.getElementById('total').textContent=data.totalVisits||0;
    document.getElementById('unique').textContent=data.uniqueVisitors||0;
    document.getElementById('initCard').style.display='none';
    
    const today=new Date().toISOString().slice(0,10);
    const todaySnap=await db.collection('stats').doc('daily').collection('days').doc(today).get();
    document.getElementById('today').textContent=todaySnap.exists?(todaySnap.data().visits||0):0;
    
    const dailySnap=await db.collection('stats').doc('daily').collection('days').orderBy('date','desc').limit(7).get();
    let html='';
    dailySnap.forEach(d=>{const v=d.data(); html+=`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eee"><span>${v.date}</span><b>${v.visits||0}</b></div>`});
    document.getElementById('daily').innerHTML=html||'';
    
    status.innerHTML='<div class="ok">✅ شغال - إجمالي: '+(data.totalVisits||0)+' - آخر زيارة: '+new Date(data.lastVisit||Date.now()).toLocaleString('ar-SD')+'</div>';
    document.getElementById('time').textContent='آخر تحديث: '+new Date().toLocaleTimeString();
  }catch(e){
    status.innerHTML='<div class="err">❌ خطأ: '+e.message+'</div>';
  }
}
load();
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocu </html>
