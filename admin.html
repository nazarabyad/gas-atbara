<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}

  font-family: "Optimistic", system-ui, sans-serif;
}

  font-family: "Optimistic Mono", ui-monospace, monospace;

</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عداد الزوار - وين الغاز؟</title>
<style>
body{font-family:system-ui;background:#f2f4f0;margin:0;padding:16px;color:#18241f}
.card{background:#fff;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 1px 4px #0001;text-align:center}
.num{font-size:42px;font-weight:800;color:#1f5b4a}
.label{color:#667069;font-size:14px;margin-top:4px}
.small{font-size:12px;color:#999;margin-top:8px}
.ok{background:#e6f5ec;color:#1f5b4a;padding:10px;border-radius:8px}
.err{background:#ffeaea;color:#b3402f;padding:10px;border-radius:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{background:#1f5b4a;color:#fff;border:0;padding:12px 20px;border-radius:99px;font-weight:700;width:100%}
</style>
</head>
<body>
<h2 style="text-align:center">👥 عداد الزوار فقط</h2>
<div id="status" class="card">⏳ جاري التحميل...</div>

<div class="grid">
  <div class="card"><div class="num" id="total">-</div><div class="label">إجمالي الزيارات<br><small>كل مرة فتحو الموقع</small></div></div>
  <div class="card"><div class="num" id="unique">-</div><div class="label">زوار فريدين<br><small>أجهزة مختلفة</small></div></div>
</div>

<div class="card">
  <div class="num" id="today" style="font-size:32px">-</div>
  <div class="label">زيارات اليوم</div>
  <div id="daily" style="margin-top:12px;text-align:right;font-size:13px"></div>
</div>

<div class="card"><button onclick="load()">🔄 تحديث الآن</button><div class="small" id="time"></div></div>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js?v=visitors_only_v2"></script>
<script>
async function getWithTimeout(promise, ms){
  return Promise.race([promise, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
}
async function load(){
  const status=document.getElementById('status');
  status.innerHTML='<div class="ok">⏳ جاري تحميل الزوار (4 ثواني timeout)...</div>';
  try{
    if(!window.FIREBASE_CONFIG) throw new Error('config.js ناقص');
    if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    const db=firebase.firestore();
    // اقفل الـ offline persistence عشان ما يعلق
    try{ await db.disableNetwork(); await db.enableNetwork(); }catch(e){}
    
    // جلب إجمالي الزوار مع timeout
    let data=null;
    try{
      const p = db.collection('stats').doc('global').get({source:'server'});
      const globalSnap = await getWithTimeout(p, 5000);
      if(globalSnap.exists) data=globalSnap.data();
    }catch(e){
      console.log('server fetch failed, trying cache',e);
      try{
        const cacheSnap=await db.collection('stats').doc('global').get({source:'cache'});
        if(cacheSnap.exists) data=cacheSnap.data();
      }catch(e2){}
    }
    
    if(!data){
      status.innerHTML='<div class="err">⚠️ لسه مافي زيارات<br><small>1- تأكد رفعت index-visitor-final.html كـ index.html<br>2- افتح arabyad.github.io?v=1 كزائر واستنى 5 ثواني<br>3- ارجع هنا</small></div>';
      document.getElementById('total').textContent='0';
      document.getElementById('unique').textContent='0';
      document.getElementById('today').textContent='0';
      return;
    }
    
    document.getElementById('total').textContent=data.totalVisits||0;
    document.getElementById('unique').textContent=data.uniqueVisitors||0;
    
    // جلب اليوم
    try{
      const today=new Date().toISOString().slice(0,10);
      const p2=db.collection('stats').doc('daily').collection('days').doc(today).get({source:'server'});
      const todaySnap=await getWithTimeout(p2, 3000);
      document.getElementById('today').textContent=todaySnap.exists?(todaySnap.data().visits||0):0;
    }catch(e){
      document.getElementById('today').textContent='-';
    }
    
    // آخر 7 أيام
    try{
      const p3=db.collection('stats').doc('daily').collection('days').orderBy('date','desc').limit(7).get({source:'server'});
      const dailySnap=await getWithTimeout(p3, 3000);
      let html='';
      dailySnap.forEach(d=>{
        const v=d.data();
        html+=`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eee"><span>${v.date}</span><b>${v.visits||0} زيارة</b></div>`;
      });
      document.getElementById('daily').innerHTML=html||'لا يوجد بيانات أيام بعد';
    }catch(e){
      document.getElementById('daily').innerHTML='<small>لا يمكن تحميل الأيام (نت ضعيف)</small>';
    }
    
    status.innerHTML='<div class="ok">✅ تم - إجمالي: '+(data.totalVisits||0)+' | آخر زيارة: '+new Date(data.lastVisit||Date.now()).toLocaleString('ar-SD')+'</div>';
    document.getElementById('time').textContent='آخر تحديث: '+new Date().toLocaleTimeString();
  }catch(e){
    status.innerHTML='<div class="err">❌ خطأ: '+e.message+'<br><small>النت ضعيف جدا - حاول تاني</small></div>';
    console.error(e);
  }
}
load();
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
